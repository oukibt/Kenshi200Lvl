[Parameters]
; Enable or disable the mod (it's supports realtime config update while game opened)
; Keep in mind, if mod disabled and one of player stats above 101, 
; that stat will be rise up (the further from 101 - the faster the level grows)
Enabled = 1

; Set the maximum skill level (must be 101.0 or above)
Max Level = 201

; Value between 0.0 and 101.0. Lower = easier leveling, higher = harder.
; Recommended: 60 to 90, especially if using mods for extra XP. Lower values may break immersion.
; After this level, leveling difficulty increases more slowly, thats allows reach 'Max Level'
; If it's set to 101, mod have no effect
Fade Level = 1

; Apply modified leveling only to player characters and ignores all NPCs (1 = On, 0 = Off)
Player Characters Only = 1

; Show debug console (1 = On, 0 = Off)
; If mod don't work - set to 1 for identify problem (of course, only if the game doesn't crash immediately xdd)
; Note: Manually closing the console also closes the game.
Debug Console = 1

; Per-skill level caps. Changing these above 101 is NOT recommended,
; as many game mechanics may break at higher levels. (must be 101.0 or above)
Science Max Level = 101
Engineer Max Level = 101
WeaponSmith Max Level = 101
ArmourSmith Max Level = 101
BowSmith Max Level = 101
Robotics Max Level = 101
Labouring Max Level = 101
Farming Max Level = 101
Cooking Max Level = 101
Medic Max Level = 101
Stealth Max Level = 101
Thieving Max Level = 101
Assassin Max Level = 101
Lockpicking Max Level = 101


; Please create a forum post or a comment on Steam if you have any problems or remarks